<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla</title>
</head>
<body>
    <ol>
        <li>Madrid</li>
        <li>Barcelona</li>
        <li>Valencia</li>
    </ol>
    <ul>
        <li>Madrid</li>
        <li>Barcelona</li>
        <li>Valencia</li>
    </ul>
    <table border>
        <thead>
            <tr>
                <th>Ciudad</th>
                <th>País</th>
                <th>Habitantes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Madrid  </td>
                <td colspan="2">asdadaw</td>
            </tr>
        </tbody>
    </table>
    
</body>
</html>
